name: Sync SV Aich fixtures · Rotormaniacs Webhooks

on:
  schedule:
    # GitHub cron uses UTC. The two daily runs are around 07:00/19:00 in German summer time.
    # The sync is idempotent, so GitHub scheduling delays cannot suppress a run.
    - cron: "7 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rotormaniacs-fixture-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enable scheduled sync
        id: schedule
        shell: bash
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.schedule.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.schedule.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify webhook configuration
        if: steps.schedule.outputs.run == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL repository secret is missing."
            exit 1
          fi

      - name: Check FUSSBALL.DE and notify Discord
        if: steps.schedule.outputs.run == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PUBLISH_ENABLED: "true"
        run: python run.py sync

      - name: Persist notification state
        if: steps.schedule.outputs.run == 'true'
        run: |
          if git diff --quiet -- data/state.json; then
            echo "Notification state is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "Update fixture notification state"
          git push
