name: Sync TSV Korntal FPV calendar

on:
  schedule:
    # UTC: around 07:07/19:07 in summer and 06:07/18:07 in winter.
    # Always execute delayed jobs; persistent state keeps repeated runs silent.
    - cron: "7 5,17 * * *"
  workflow_dispatch:
    inputs:
      verify_poll:
        description: "Verify a silent native poll and remove the temporary test message"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tsv-korntal-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test calendar synchronization
        run: python -m unittest tests.test_korntal -v
      - name: Verify native webhook polls
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_poll }}
        env:
          KORNTAL_3_5_WEBHOOK_URL: ${{ secrets.KORNTAL_3_5_WEBHOOK_URL }}
        run: python run_korntal.py verify-poll
      - name: Sync Korntal feeds
        id: sync
        env:
          KORNTAL_WHOOP_WEBHOOK_URL: ${{ secrets.KORNTAL_WHOOP_WEBHOOK_URL }}
          KORNTAL_3_5_WEBHOOK_URL: ${{ secrets.KORNTAL_3_5_WEBHOOK_URL }}
          KORNTAL_RACE_WEBHOOK_URL: ${{ secrets.KORNTAL_RACE_WEBHOOK_URL }}
        run: python run_korntal.py sync
      - name: Persist Korntal state
        # Preserve successful messages even if a later feed or message failed.
        if: ${{ always() && steps.sync.outcome != 'skipped' }}
        run: |
          if [ -z "$(git status --porcelain -- data/korntal)" ]; then echo "Korntal state is unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/korntal
          git commit -m "Update TSV Korntal calendar state"
          git pull --rebase origin main
          git push
